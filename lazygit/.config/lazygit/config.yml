gui:
  nerdFontsVersion: '3'
  sidePanels:
    - [files, submodules]
    - [branches, remotes, tags]
    - [commits, reflog]
    - [stash]
  expandFocusedSidePanel: true
  shrinkSidePanelsToContent: true

git:
  branchLogCmd: git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium --first-parent {{branchName}} --
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative --pretty=medium --first-parent
  diffRenderers:
    - name: Delta
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

