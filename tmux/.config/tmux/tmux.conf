source-file ~/.config/tmux/tmux.reset.conf

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -ga terminal-overrides ',xterm-ghostty:Tc'

# -- Change prefix key --
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- General Settings --
set -g mouse on
set -g set-clipboard on             # use system clipboard
set -g history-limit 1000000        # increase history size from 2000
set -g detach-on-destroy off        # don't exit from tmux when closing a session
set -g escape-time 0                # zero-out escape-time delay
set -g base-index 1                 # start indexing windows at 1 instead of 0
setw -g pane-base-index 1           # start indexing panes at 1 instead of 0
set -g renumber-windows on          # renumber all windows when a window is closed
set -g allow-passthrough on         # needed for kitty graphics protocol support

setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable Kitty Progressive Keyboard Protocol (Ctrl+Shift+Key shortcuts)
set -s extended-keys on

# -- Status bar --
set -g status-position top
set -g status-right "#[fg=$accent_color] #[fg=$text_color]#(basename #{pane_current_path}) "

# -- Pane borders --
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'binoymanoj/tmux-minimal-theme'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @vim_navigator_mapping_left 'C-h'
set -g @vim_navigator_mapping_down 'C-j'
set -g @vim_navigator_mapping_up 'C-k'
set -g @vim_navigator_mapping_right 'C-l'
set -g @vim_navigator_mapping_prev ''
set -g @minimal_theme_bg_color "#1a1b26"
set -g @minimal_theme_active_color "#7aa2f7"
set -g @minimal_theme_inactive_color "#565f89"
set -g @minimal_theme_text_color "#c0caf5"
set -g @minimal_theme_accent_color "#7aa2f7"
set -g @minimal_theme_border_color "#414868"

# Automatically install TPM if missing
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

